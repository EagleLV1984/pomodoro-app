<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="超坦番茄钟">
<meta name="theme-color" content="#FDF2F2">
<link rel="manifest" href="./manifest.json">
<title>超坦番茄钟</title>
<style>
  :root {
    --accent: #C15543;
    --accent-rgb: 193, 85, 67;
    --accent-glow: rgba(var(--accent-rgb), 0.35);
    --text: #5D2E2E;
    --text2: #9A9A9A;
    --text3: #B8A0A0;
    --ring-size: 200px;
  }
  body.dark {
    --accent: #E07060;
    --accent-rgb: 224, 112, 96;
    --accent-glow: rgba(var(--accent-rgb), 0.4);
    --text: #E8D0D0;
    --text2: #8A7070;
    --text3: #6A5555;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei UI', sans-serif;
    color: var(--text);
    display: flex; justify-content: center; align-items: center;
    user-select: none; -webkit-user-select: none;
    overflow: hidden;
  }

  /* 暖色渐变背景 */
  .bg-layer {
    position: fixed; inset: 0; z-index: 0;
    background-color: #FDF2F2; /* 图片加载失败时的默认色 */
    background-image: url('./pomodoro.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  .bg-glass-tint {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(ellipse 70% 50% at 25% 15%, rgba(220,120,100,0.2) 0%, transparent 55%),
      radial-gradient(ellipse 60% 70% at 75% 75%, rgba(var(--accent-rgb),0.15) 0%, transparent 55%),
      radial-gradient(ellipse 50% 40% at 55% 50%, rgba(245,225,210,0.25) 0%, transparent 50%);
  }
  body.dark .bg-glass-tint {
    background:
      radial-gradient(ellipse 70% 50% at 25% 15%, rgba(var(--accent-rgb),0.15) 0%, transparent 55%),
      radial-gradient(ellipse 60% 70% at 75% 75%, rgba(85,60,60,0.2) 0%, transparent 55%);
  }

  /* === 液态玻璃组件 === */
  .liquid_glass-wrapper {
    position: relative; display: flex; overflow: hidden;
    border-radius: var(--border-radius);
  }
  .liquid_glass-outer {
    backdrop-filter: url(#liquid_glass_filter);
    position: absolute; inset: 0; z-index: 0;
    border-radius: var(--border-radius);
    mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><rect x="0" y="0" width="100%" height="100%" rx="0" ry="0" fill="white"/></svg>'),
      url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><rect x="5" y="5" width="calc(100% - 10px)" height="calc(100% - 10px)" rx="21" ry="21" fill="white"/></svg>');
    mask-composite: exclude;
  }
  .liquid_glass-cover {
    backdrop-filter: blur(3px);
    position: absolute; inset: 0; z-index: 2;
    border-radius: var(--border-radius);
    background: rgba(255,255,255,0.2);
  }
  body.dark .liquid_glass-cover { background: rgba(0,0,0,0.15); }
  .liquid_glass-sharp {
    position: absolute; inset: 0; z-index: 3;
    box-shadow: inset 1px 1px 0px 0px rgba(255,255,255,0.6), inset -1px -1px 0px 0px rgba(255,255,255,0.5);
    border-radius: var(--border-radius);
  }
  body.dark .liquid_glass-sharp { box-shadow: inset 1px 1px 0px 0px rgba(255,255,255,0.15), inset -1px -1px 0px 0px rgba(255,255,255,0.12); }
  .liquid_glass-reflect {
    position: absolute; inset: 1px; z-index: 2;
    box-shadow: inset 2px 2px 6px 2px rgba(255,255,255,0.25), inset -2px -2px 4px -1px rgba(255,255,255,0.2);
    border-radius: var(--border-radius);
  }
  body.dark .liquid_glass-reflect { box-shadow: inset 2px 2px 6px 2px rgba(255,255,255,0.06), inset -2px -2px 4px -1px rgba(255,255,255,0.05); }

  /* === App === */
  .app {
    position: relative; z-index: 10;
    width: 100%; height: 100%;
    padding: clamp(8px, 2vh, 20px) clamp(12px, 4vw, 32px);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: clamp(6px, 2vh, 16px);
  }
  .btn-settings {
    position: absolute; top: clamp(6px, 2vh, 14px); right: clamp(12px, 4vw, 32px);
    width: 32px; height: 32px; border: none; background: transparent; cursor: pointer;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; z-index: 10;
  }
  .btn-settings svg { width: 16px; height: 16px; color: var(--text3); }
  .btn-settings:hover svg { color: var(--accent); }

  /* 模式切换 */
  .modes {
    display: flex; gap: 0; width: min(100%, 500px);
  }
  .mode-btn {
    flex: 1; border: none; background: transparent; cursor: pointer;
    padding: clamp(5px, 1.2vh, 14px) 0; font-size: clamp(11px, 2.5vw, 20px); font-weight: 500;
    transition: all 0.25s; white-space: nowrap; text-align: center;
    font-family: inherit; letter-spacing: 0.5px; position: relative; z-index: 5;
    color: var(--text2);
  }
  .mode-btn.active { color: var(--accent); font-weight: 600; }
  .mode-btn:hover:not(.active) { color: var(--text); }

  /* 圆环 */
  .timer-wrap {
    container-type: inline-size; position: relative;
    width: min(70vw, 55vh); height: min(70vw, 55vh);
    max-width: 270px; max-height: 270px; min-width: 120px; min-height: 120px;
  }
  .timer-ring { transform: rotate(-90deg); width: 100%; height: 100%; }
  .ring-bg { fill: none; stroke: rgba(var(--accent-rgb),0.08); stroke-width: 5; }
  body.dark .ring-bg { stroke: rgba(255,255,255,0.06); }
  .ring-progress {
    fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round;
    filter: drop-shadow(0 0 10px var(--accent-glow));
    transition: stroke-dashoffset 0.35s linear;
  }
  .timer-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; }
  .time {
    font-size: clamp(22px, 24cqw, 62px); font-weight: 300; letter-spacing: 1px;
    font-family: -apple-system, 'Inter', 'Microsoft YaHei UI', sans-serif;
    line-height: 1; color: var(--text);
  }
  .status { font-size: clamp(8px, 5cqw, 13px); color: var(--text3); margin-top: 4px; letter-spacing: 1.5px; }
  body.mini .time { font-size: clamp(18px, 24cqw, 28px); }
  body.mini .status { font-size: 9px; }

  /* 控制按钮 */
  .controls { display: flex; gap: 12px; align-items: center; width: min(100%, 360px); }
  .controls .liquid_glass-wrapper { flex-shrink: 0; }

  /* 按钮玻璃容器 */
  .glass-btn-play {
    --border-radius: 30px; flex: 1; height: clamp(34px, 6vh, 48px);
  }
  .glass-btn-side {
    --border-radius: 30px; width: clamp(34px, 6vh, 48px); height: clamp(34px, 6vh, 48px); flex-shrink: 0;
  }
  .btn-play-content {
    position: relative; z-index: 5;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; height: 100%;
    color: #fff; font-size: clamp(12px, 2vw, 16px); font-weight: 600;
    font-family: inherit; letter-spacing: 0.5px;
  }
  .btn-side-content {
    position: relative; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%;
    color: var(--text2); font-size: clamp(14px, 2.5vw, 18px);
  }

  /* 进度点 */
  .dots {
    display: flex; gap: 8px; align-items: center; padding: 6px 14px;
  }
  .dot {
    position: relative; z-index: 5;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); transition: all 0.3s;
  }
  .dot.dim { opacity: 0.2; }
  .dot-desc {
    position: relative; z-index: 5;
    font-size: 11px; color: var(--text2); margin-left: 4px; letter-spacing: 0.5px;
  }

  /* Toast */
  .toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-120px);
    border-radius: 24px; box-shadow: 0 8px 30px rgba(93,46,46,0.12);
    transition: transform 0.35s cubic-bezier(0.175,0.885,0.32,1.275);
    pointer-events: none; z-index: 300;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast-label {
    position: relative; z-index: 5; padding: 11px 24px;
    font-size: 13px; letter-spacing: 0.5px; color: var(--text);
  }

  /* Flash */
  .flash { position: fixed; inset: 0; pointer-events: none; z-index: 99; transition: background 0.15s; }
  .flash.pop { background: rgba(var(--accent-rgb),0.08); transition: background 0s; }

  /* 完成提醒 */
  .alarm-overlay {
    position: fixed; inset: 0; z-index: 250;
    background: rgba(93,46,46,0.15); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .alarm-overlay.show { opacity: 1; pointer-events: auto; }
  .alarm-card-content {
    position: relative; z-index: 5;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    padding: 30px 26px; text-align: center; width: 280px;
  }
  .alarm-icon { font-size: 48px; animation: pulse 0.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
  .alarm-title { font-size: 20px; font-weight: 600; color: var(--text); letter-spacing: 0.5px; }
  .alarm-subtitle { font-size: 13px; color: var(--text2); margin-top: -8px; }
  .btn-next {
    width: 100%; padding: 13px 0; border: none; border-radius: 26px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
    font-family: inherit; letter-spacing: 1px; cursor: pointer;
    position: relative; z-index: 5;
    box-shadow: 0 4px 20px var(--accent-glow);
    transition: all 0.2s;
  }
  .btn-next:hover { box-shadow: 0 6px 28px rgba(var(--accent-rgb),0.5); }
  .btn-next:active { transform: scale(1.06); transition: transform 0.1s ease-out; }
  .btn-next:not(:active) { transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); }

  /* 按钮按下放大 */
  .liquid_glass-wrapper:active, .liquid_glass-wrapper.pressed { transform: scale(1.12); transition: transform 0.15s ease-out; }
  .liquid_glass-wrapper:not(:active):not(.pressed) { transition: transform 0.6s cubic-bezier(0.34,1.56,0.64,1); }
  .btn-play-content:active, .btn-play-content.pressed { transform: scale(1.1); transition: transform 0.15s ease-out; }
  .btn-play-content:not(:active):not(.pressed) { transition: transform 0.6s cubic-bezier(0.34,1.56,0.64,1); }

  /* 按钮内光晕（overflow:hidden 裁剪） */
  .btn-glow {
    position: absolute; z-index: 4; pointer-events: none;
    width: 100px; height: 260px; border-radius: 50%;
    background: radial-gradient(ellipse 30% 50% at center, rgba(255,255,255,1) 0%, rgba(255,255,255,0.72) 25%, rgba(255,255,255,0.25) 55%, transparent 78%);
    filter: blur(20px); mix-blend-mode: color-dodge;
    transform: translate(-50%, -50%); opacity: 0;
    transition: opacity 0.2s;
  }
  .btn-glow.on { opacity: 1; }

  .btn-next-later {
    background: transparent; border: none; color: var(--text2);
    font-size: 12px; cursor: pointer; font-family: inherit;
    position: relative; z-index: 5;
  }

  /* 设置面板 */
  .settings-overlay {
    position: fixed; inset: 0; background: rgba(93,46,46,0.12); z-index: 200;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .settings-overlay.open { opacity: 1; pointer-events: auto; }
  .settings-panel {
    position: absolute; top: 0; right: 0; width: 260px; max-width: 85vw;
    height: 100%;
    background: var(--settings-bg, rgba(253,242,242,0.85));
    backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    box-shadow: -4px 0 24px rgba(93,46,46,0.1);
    transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    display: flex; flex-direction: column;
  }
  body.dark .settings-panel { background: rgba(26,20,20,0.85); }
  .settings-overlay.open .settings-panel { transform: translateX(0); }
  .settings-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid rgba(var(--accent-rgb),0.08);
  }
  .settings-header h2 { font-size: 16px; font-weight: 600; color: var(--text); }
  .settings-close {
    width: 30px; height: 30px; border: none; background: rgba(var(--accent-rgb),0.08);
    color: var(--text2); border-radius: 50%; cursor: pointer;
    font-size: 14px; display: flex; align-items: center; justify-content: center;
  }
  .settings-close:hover { background: var(--accent); color: #fff; }
  .settings-body { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 14px; }
  .setting-group { display: flex; align-items: center; justify-content: space-between; }
  .setting-group label:first-child { font-size: 13px; color: var(--text); font-weight: 500; }
  .setting-group input[type="number"] {
    width: 58px; padding: 6px 8px; border: 1px solid rgba(var(--accent-rgb),0.12);
    border-radius: 8px; font-size: 13px; text-align: center;
    font-family: inherit; color: var(--text); background: rgba(255,255,255,0.4);
  }
  .setting-hint { font-size: 10px; color: var(--text3); margin-top: -10px; text-align: right; }
  .toggle-switch { position: relative; width: 44px; height: 24px; display: inline-block; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; inset: 0; background: rgba(var(--accent-rgb),0.15); border-radius: 12px; cursor: pointer; transition: background 0.3s; }
  .toggle-slider::before { content: ''; position: absolute; width: 20px; height: 20px; left: 2px; bottom: 2px; background: #fff; border-radius: 50%; transition: transform 0.3s; }
  .toggle-switch input:checked+.toggle-slider { background: var(--accent); }
  .toggle-switch input:checked+.toggle-slider::before { transform: translateX(20px); }
  .btn-reset-settings {
    width: 100%; padding: 10px; border: 1px solid rgba(var(--accent-rgb),0.1);
    background: transparent; color: var(--text2); border-radius: 10px;
    cursor: pointer; font-size: 13px; font-family: inherit;
  }
  .btn-reset-settings:hover { background: rgba(var(--accent-rgb),0.05); color: var(--accent); }

  /* Mini */
  body.mini .timer-wrap { max-width: 120px; max-height: 120px; min-width: 80px; min-height: 80px; }
  body.mini .app { gap: 3px; justify-content: center; }
  body.mini .mode-btn { padding: 3px 8px; font-size: 9px; }  body.mini .glass-btn-play { height: 32px; }
  body.mini .glass-btn-side { width: 32px; height: 32px; }
  body.mini .btn-play-content { font-size: 12px; }
  body.mini .dots { gap: 4px; padding: 4px 10px; }
  body.mini .dot { width: 6px; height: 6px; }
  body.mini .dot-desc { font-size: 9px; }
  body.mini .controls { width: auto; gap: 8px; }
</style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <defs>
    <filter id="liquid_glass_filter" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox">
      <feDisplacementMap scale="200" />
    </filter>
  </defs>
</svg>

<div class="bg-layer" id="bgLayer"></div>
<div class="bg-glass-tint"></div>

<div class="app">
  <button class="btn-settings" id="btnSettings" title="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>

  <!-- 模式切换（液态玻璃） -->
  <div class="liquid_glass-wrapper" style="--border-radius: 26px; width: min(100%, 360px)" id="modesWrap">
    <div class="btn-glow" id="glowModes"></div>
    <div class="liquid_glass-outer"></div><div class="liquid_glass-cover"></div>
    <div class="liquid_glass-sharp"></div><div class="liquid_glass-reflect"></div>
    <div class="modes">
      <button class="mode-btn active" data-mode="work">专注</button>
      <button class="mode-btn" data-mode="short">短休息</button>
      <button class="mode-btn" data-mode="long">长休息</button>
    </div>
  </div>

  <!-- 圆环 -->
  <div class="timer-wrap">
    <svg class="timer-ring" viewBox="0 0 200 200">
      <circle class="ring-bg" cx="100" cy="100" r="93"/>
      <circle class="ring-progress" cx="100" cy="100" r="93" stroke-dasharray="584.3" stroke-dashoffset="0"/>
    </svg>
    <div class="timer-center"><div class="time">25:00</div><div class="status">准备开始</div></div>
  </div>

  <!-- 控制按钮 -->
  <div class="controls">
    <!-- 跳过（玻璃+淡暖色） -->
    <div class="liquid_glass-wrapper glass-btn-side" id="btnSkipWrap">
      <div class="btn-glow" id="glowSkip"></div>
<div class="liquid_glass-outer"></div><div class="liquid_glass-cover"></div>
      <div class="liquid_glass-sharp"></div><div class="liquid_glass-reflect"></div>
      <div class="btn-side-content" id="btnSkip">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </div>
    </div>
    <!-- 开始/暂停（纯液态玻璃） -->
    <div class="liquid_glass-wrapper glass-btn-play" id="btnPlayWrap">
      <div class="btn-glow" id="glowPlay"></div>
      <div class="liquid_glass-outer"></div><div class="liquid_glass-cover"></div>
      <div class="liquid_glass-sharp"></div><div class="liquid_glass-reflect"></div>
      <div class="btn-play-content" id="btnPlay">
        <svg width="14" height="14" viewBox="0 0 28 28" id="playIcon"><polygon points="8,4 24,14 8,24" fill="currentColor"/></svg>
        <svg width="14" height="14" viewBox="0 0 28 28" id="pauseIcon" style="display:none"><rect x="6" y="4" width="6" height="20" rx="2" fill="currentColor"/><rect x="16" y="4" width="6" height="20" rx="2" fill="currentColor"/></svg>
        <span id="btnLabel">开始</span>
      </div>
    </div>
    <!-- 重置（玻璃+淡暖色） -->
    <div class="liquid_glass-wrapper glass-btn-side" id="btnResetWrap">
      <div class="btn-glow" id="glowReset"></div>
<div class="liquid_glass-outer"></div><div class="liquid_glass-cover"></div>
      <div class="liquid_glass-sharp"></div><div class="liquid_glass-reflect"></div>
      <div class="btn-side-content" id="btnReset">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.5 17.5A9 9 0 1 0 2 12"/></svg>
      </div>
    </div>
  </div>

  <!-- 进度点 -->
  <div class="liquid_glass-wrapper" style="--border-radius: 20px">
    <div class="liquid_glass-outer"></div><div class="liquid_glass-cover"></div>
    <div class="liquid_glass-sharp"></div><div class="liquid_glass-reflect"></div>
    <div class="dots">
      <div class="dot dim" id="dot1"></div><div class="dot dim" id="dot2"></div><div class="dot dim" id="dot3"></div><div class="dot dim" id="dot4"></div>
      <span class="dot-desc">已完成 <span id="countPomodoros">0</span> 个超坦番茄钟</span>
    </div>
  </div>
</div>

<!-- 设置 -->
<div class="settings-overlay" id="settingsOverlay"><div class="settings-panel"><div class="settings-header"><h2>设置</h2><button class="settings-close" id="btnSettingsClose">✕</button></div><div class="settings-body">
  <div class="setting-group"><label>专注时间（分）</label><input type="number" id="setWorkMin" min="1" max="120" value="25"></div>
  <div class="setting-group"><label>短休息（分）</label><input type="number" id="setShortMin" min="1" max="30" value="5"></div>
  <div class="setting-group"><label>长休息（分）</label><input type="number" id="setLongMin" min="1" max="60" value="15"></div>
  <div class="setting-group"><label>深色模式</label><label class="toggle-switch"><input type="checkbox" id="setDarkMode"><span class="toggle-slider"></span></label></div>
  <div class="setting-group"><label>提示音</label><label class="toggle-switch"><input type="checkbox" id="setSound" checked><span class="toggle-slider"></span></label></div>
  <div class="setting-group"><label>完成确认</label><label class="toggle-switch"><input type="checkbox" id="setConfirmMode" checked><span class="toggle-slider"></span></label></div>
  <div class="setting-group"><label>自动续时</label><label class="toggle-switch"><input type="checkbox" id="setAutoStart" checked><span class="toggle-slider"></span></label></div>
  <div class="setting-hint">完成番茄后自动开始下一阶段</div>
  <div class="setting-group"><label>窗口置顶</label><label class="toggle-switch"><input type="checkbox" id="setTopMost"><span class="toggle-slider"></span></label></div>
  <div class="setting-group"><label>迷你模式</label><label class="toggle-switch"><input type="checkbox" id="setMini"><span class="toggle-slider"></span></label></div>
  <div class="setting-group">
    <label>面板颜色</label>
    <div style="display:flex;align-items:center;gap:8px">
      <div id="colorPreview" style="width:28px;height:28px;border-radius:8px;background:rgba(253,242,242,0.85);border:1px solid rgba(0,0,0,0.1);cursor:pointer" title="点击取色"></div>
      <button id="btnPickColor" style="padding:6px 12px;border:1px solid rgba(var(--accent-rgb),0.2);border-radius:8px;background:transparent;color:var(--accent);font-size:12px;font-family:inherit;cursor:pointer">取色</button>
      <button id="btnResetColor" style="padding:6px 8px;border:none;border-radius:6px;background:transparent;color:var(--text3);font-size:12px;font-family:inherit;cursor:pointer">重置</button>
    </div>
  </div>
  <div class="setting-hint">从屏幕任意位置取色，应用于设置面板</div>
  <button class="btn-reset-settings" id="btnResetStats">今日番茄归零</button>
  <button class="btn-reset-settings" id="btnResetSettings">恢复默认设置</button>
</div></div></div>

<!-- 完成提醒 -->
<div class="alarm-overlay" id="alarmOverlay">
  <div class="liquid_glass-wrapper" style="--border-radius: 24px; width: 300px">
    <div class="liquid_glass-outer"></div><div class="liquid_glass-cover"></div>
    <div class="liquid_glass-sharp"></div><div class="liquid_glass-reflect"></div>
    <div class="alarm-card-content">
      <div class="alarm-icon">🔔</div><div class="alarm-title" id="alarmTitle">番茄完成！</div><div class="alarm-subtitle" id="alarmSubtitle">休息一下吧~</div>
      <button class="btn-next" id="btnNext">下一步 ▸</button>
      <button class="btn-next-later" id="btnNextLater">稍后（继续响铃）</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <div class="liquid_glass-wrapper" style="--border-radius: 24px">
    <div class="liquid_glass-outer"></div><div class="liquid_glass-cover"></div>
    <div class="liquid_glass-sharp"></div><div class="liquid_glass-reflect"></div>
    <span class="toast-label" id="toastLabel"></span>
  </div>
</div>
<div class="flash" id="flash"></div>

<script>
const isMac = /Mac/i.test(navigator.platform || navigator.userAgentData?.platform || '');
const macVer = navigator.userAgent.match(/Mac OS X (\d+[._]\d+)/);
const macMajor = macVer ? parseInt(macVer[1].split('_')[0]) : 0;
if (isMac && macMajor >= 26) document.body.classList.add('mac-native-glass');

const $ring = document.querySelector('.ring-progress');
const VIEWBOX_R = 93;
function updateRingDisplay() { $ring.style.strokeDashoffset = (2 * Math.PI * VIEWBOX_R) * (1 - (remaining / totalSeconds)); }
window.addEventListener('resize', ()=>{ updateRingDisplay(); });

const CONFIG = { work:{minutes:25,color:'#C15543',glow:'rgba(193,85,67,0.35)',status:'专注中'}, short:{minutes:5,color:'#A0C155',glow:'rgba(160,193,85,0.35)',status:'休息中'}, long:{minutes:15,color:'#55A0C1',glow:'rgba(85,160,193,0.35)',status:'休息中'} };
let soundEnabled=true, autoStart=true, confirmMode=true, alwaysOnTop=false, miniMode=false, darkMode=false, pickedColor='';
(function loadSettings(){
  const w=parseInt(localStorage.getItem('pomo_work_min')), s=parseInt(localStorage.getItem('pomo_short_min')), l=parseInt(localStorage.getItem('pomo_long_min'));
  if(w>=1&&w<=120)CONFIG.work.minutes=w; if(s>=1&&s<=30)CONFIG.short.minutes=s; if(l>=1&&l<=60)CONFIG.long.minutes=l;
  soundEnabled=localStorage.getItem('pomo_sound')!=='false'; autoStart=localStorage.getItem('pomo_autostart')!=='false';
  confirmMode=localStorage.getItem('pomo_confirm')!=='false';
  alwaysOnTop=localStorage.getItem('pomo_topmost')==='true'; miniMode=localStorage.getItem('pomo_mini')==='true'; darkMode=localStorage.getItem('pomo_dark')==='true';
  pickedColor=localStorage.getItem('pomo_picked_color')||'';
  if(miniMode)applyMini(true); if(darkMode)document.body.classList.add('dark');
  if(pickedColor) document.documentElement.style.setProperty('--settings-bg', pickedColor);
})();
function saveSettings(){ localStorage.setItem('pomo_work_min',CONFIG.work.minutes); localStorage.setItem('pomo_short_min',CONFIG.short.minutes); localStorage.setItem('pomo_long_min',CONFIG.long.minutes); localStorage.setItem('pomo_sound',soundEnabled); localStorage.setItem('pomo_autostart',autoStart); localStorage.setItem('pomo_confirm',confirmMode); localStorage.setItem('pomo_topmost',alwaysOnTop); localStorage.setItem('pomo_mini',miniMode); localStorage.setItem('pomo_dark',darkMode); }

// ===== 屏幕取色 =====
async function pickColor() {
  closeSettings();
  if (typeof EyeDropper !== 'undefined') {
    try { const d=new EyeDropper(); const r=await d.open(); applyPickedColor(r.sRGBHex); openSettings(); return; } catch(e){}
  }
  const inp=document.createElement('input'); inp.type='color'; inp.value='#c15543';
  inp.style.position='fixed';inp.style.top='-100px'; document.body.appendChild(inp);
  inp.addEventListener('input',()=>{applyPickedColor(inp.value);document.body.removeChild(inp);openSettings();});
  inp.addEventListener('change',()=>{if(document.body.contains(inp))document.body.removeChild(inp);openSettings();});
  inp.click();
}
function applyPickedColor(hex) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  pickedColor=`rgba(${r},${g},${b},0.85)`; localStorage.setItem('pomo_picked_color',pickedColor);
  document.documentElement.style.setProperty('--settings-bg',pickedColor);
  document.getElementById('colorPreview').style.background=pickedColor;
}
function resetPickedColor() {
  pickedColor=''; localStorage.removeItem('pomo_picked_color');
  document.documentElement.style.setProperty('--settings-bg','rgba(253,242,242,0.85)');
  document.getElementById('colorPreview').style.background='rgba(253,242,242,0.85)';
}
function sendToHost(msg){ if(window.chrome?.webview?.postMessage){window.chrome.webview.postMessage(JSON.stringify(msg));} if(window.webkit?.messageHandlers?.hostBridge?.postMessage){window.webkit.messageHandlers.hostBridge.postMessage(msg);} if(window.hostBridge?.postMessage){window.hostBridge.postMessage(JSON.stringify(msg));} }
function applyMini(on){ document.body.classList.toggle('mini',on); sendToHost({type:'resizeWindow',width:on?300:400,height:on?360:580}); }
sendToHost({type:'alwaysOnTop',value:alwaysOnTop}); if(darkMode)sendToHost({type:'setDarkMode',value:true});

let currentMode='work', totalSeconds=CONFIG.work.minutes*60, remaining=totalSeconds, intervalId=null, running=false;
let pomodoroCount=parseInt(localStorage.getItem('pomo_count')||'0'), todayCount=parseInt(localStorage.getItem('pomo_today')||'0'), todayDate=localStorage.getItem('pomo_date')||'';
const $time=document.querySelector('.time'),$status=document.querySelector('.status'),$playIcon=document.getElementById('playIcon'),$pauseIcon=document.getElementById('pauseIcon'),$btnLabel=document.getElementById('btnLabel'),$accent=document.documentElement.style,$toast=document.getElementById('toast'),$toastLabel=document.getElementById('toastLabel'),$flash=document.getElementById('flash'),$countPomo=document.getElementById('countPomodoros'),$modeBtns=document.querySelectorAll('.mode-btn');
const dots=[document.getElementById('dot1'),document.getElementById('dot2'),document.getElementById('dot3'),document.getElementById('dot4')];
function checkToday(){ const d=new Date().toDateString(); if(todayDate!==d){todayDate=d;todayCount=0;localStorage.setItem('pomo_today','0');localStorage.setItem('pomo_date',d);} }
function updateDisplay(){ const m=Math.floor(remaining/60),s=remaining%60; $time.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; document.title=`${$time.textContent} | 超坦番茄钟`; updateRingDisplay(); }
function updateStats(){ $countPomo.textContent=todayCount; localStorage.setItem('pomo_count',pomodoroCount); localStorage.setItem('pomo_today',todayCount); localStorage.setItem('pomo_date',todayDate); const c=todayCount%4; dots.forEach((d,i)=>d.classList.toggle('dim',i>=c)); }
function setMode(mode){ currentMode=mode; totalSeconds=CONFIG[mode].minutes*60; remaining=totalSeconds; $accent.setProperty('--accent',CONFIG[mode].color); $accent.setProperty('--accent-glow',CONFIG[mode].glow); $status.textContent='准备开始'; $btnLabel.textContent='开始'; $modeBtns.forEach(b=>b.classList.toggle('active',b.dataset.mode===mode)); updateDisplay(); stopTimer(); }
function startTimer(){ running=true; $status.textContent=CONFIG[currentMode].status; $playIcon.style.display='none'; $pauseIcon.style.display='block'; $btnLabel.textContent='暂停'; intervalId=setInterval(()=>{remaining--;updateDisplay();if(remaining<=0)complete();},1000); }
function pauseTimer(){ running=false; $status.textContent='已暂停'; $playIcon.style.display='block'; $pauseIcon.style.display='none'; $btnLabel.textContent='继续'; clearInterval(intervalId);intervalId=null; }
function stopTimer(){ running=false; $playIcon.style.display='block'; $pauseIcon.style.display='none'; $btnLabel.textContent='开始'; clearInterval(intervalId);intervalId=null; remaining=totalSeconds; updateDisplay(); }
function skipCurrent(){ if(running){remaining=0;updateDisplay();complete();} }
let alarmCtx=null,alarmTimerId=null,pendingNextMode=null;
function startAlarm(){ if(!soundEnabled)return; stopAlarm(); try{alarmCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;} playBeep(); alarmTimerId=setInterval(playBeep,1800); }
function playBeep(){ if(!alarmCtx)return; try{ const now=alarmCtx.currentTime; [880,1100].forEach((freq,i)=>{ const o=alarmCtx.createOscillator(),g=alarmCtx.createGain(); o.connect(g);g.connect(alarmCtx.destination); o.type='sine';o.frequency.value=freq; const t=now+i*0.15; g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2); o.start(t);o.stop(t+0.25); }); }catch(e){} }
function stopAlarm(){ if(alarmTimerId){clearInterval(alarmTimerId);alarmTimerId=null;} if(alarmCtx){alarmCtx.close().catch(()=>{});alarmCtx=null;} }
function confirmNext(){ stopAlarm(); document.getElementById('alarmOverlay').classList.remove('show'); if(pendingNextMode){ setMode(pendingNextMode); pendingNextMode=null; updateStats(); if(autoStart)startTimer(); } }
function complete(){
  stopTimer(); $flash.classList.add('pop'); setTimeout(()=>$flash.classList.remove('pop'),150);
  if(currentMode==='work'){pomodoroCount++;todayCount++;pendingNextMode=todayCount%4===0?'long':'short';}
  else{pendingNextMode='work';}
  if(confirmMode){
    startAlarm();
    document.getElementById('alarmTitle').textContent=currentMode==='work'?'番茄完成！':'休息结束！';
    document.getElementById('alarmSubtitle').textContent=currentMode==='work'?'休息一下吧~':'继续加油！';
    document.getElementById('alarmOverlay').classList.add('show');
  }else{
    if(soundEnabled){ try{ const ctx=new(window.AudioContext||window.webkitAudioContext)(); [0,0.12].forEach((d,i)=>{ const o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g);g.connect(ctx.destination); o.type='sine';o.frequency.value=i===0?880:1100; g.gain.setValueAtTime(0.25,ctx.currentTime+d); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d+0.25); o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+0.25); }); }catch(e){} }
    showToast(currentMode==='work'?'完成一个番茄！':'休息结束！');
    setMode(pendingNextMode); updateStats(); pendingNextMode=null; if(autoStart)startTimer();
  }
  if(Notification.permission==='granted'){new Notification('超坦番茄钟',{body:currentMode==='work'?'一个番茄完成，休息一下吧~':'休息结束，继续加油！'});}
}
function showToast(msg){ $toastLabel.textContent=msg; $toast.classList.add('show'); clearTimeout($toast._timeout); $toast._timeout=setTimeout(()=>$toast.classList.remove('show'),2000); }
function refreshSettingsUI(){ document.getElementById('setWorkMin').value=CONFIG.work.minutes; document.getElementById('setShortMin').value=CONFIG.short.minutes; document.getElementById('setLongMin').value=CONFIG.long.minutes; document.getElementById('setSound').checked=soundEnabled; document.getElementById('setAutoStart').checked=autoStart; document.getElementById('setConfirmMode').checked=confirmMode; document.getElementById('setTopMost').checked=alwaysOnTop; document.getElementById('setMini').checked=miniMode; document.getElementById('setDarkMode').checked=darkMode;
  const cp=document.getElementById('colorPreview'); if(cp)cp.style.background=pickedColor||'rgba(253,242,242,0.85)'; }
function openSettings(){refreshSettingsUI();document.getElementById('settingsOverlay').classList.add('open');}
function closeSettings(){document.getElementById('settingsOverlay').classList.remove('open');}
function applySettings(){
  CONFIG.work.minutes=Math.max(1,Math.min(120,parseInt(document.getElementById('setWorkMin').value)||25));
  CONFIG.short.minutes=Math.max(1,Math.min(30,parseInt(document.getElementById('setShortMin').value)||5));
  CONFIG.long.minutes=Math.max(1,Math.min(60,parseInt(document.getElementById('setLongMin').value)||15));
  soundEnabled=document.getElementById('setSound').checked; autoStart=document.getElementById('setAutoStart').checked;
  confirmMode=document.getElementById('setConfirmMode').checked;
  alwaysOnTop=document.getElementById('setTopMost').checked; miniMode=document.getElementById('setMini').checked; darkMode=document.getElementById('setDarkMode').checked;
  saveSettings(); sendToHost({type:'alwaysOnTop',value:alwaysOnTop}); sendToHost({type:'setDarkMode',value:darkMode});
  document.body.classList.toggle('dark',darkMode); applyMini(miniMode);
  if(!running)setMode(currentMode); closeSettings();
}
document.getElementById('btnPlayWrap').addEventListener('click',()=>running?pauseTimer():startTimer());
document.getElementById('btnResetWrap').addEventListener('click',()=>stopTimer());
document.getElementById('btnSkipWrap').addEventListener('click',()=>skipCurrent());
document.getElementById('btnPickColor').addEventListener('click',()=>pickColor());
document.getElementById('btnResetColor').addEventListener('click',()=>resetPickedColor());
document.getElementById('colorPreview').addEventListener('click',()=>pickColor());
document.getElementById('btnNext').addEventListener('click',()=>confirmNext());
document.getElementById('btnNextLater').addEventListener('click',()=>stopAlarm());
document.getElementById('btnSettings').addEventListener('click',openSettings);
document.getElementById('btnSettingsClose').addEventListener('click',closeSettings);
document.getElementById('settingsOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('settingsOverlay'))closeSettings();});
document.getElementById('settingsOverlay').addEventListener('change',e=>{if(e.target.matches('input'))applySettings();});
document.getElementById('btnResetStats').addEventListener('click',()=>{todayCount=0;localStorage.setItem('pomo_today','0');updateStats();showToast('今日番茄已归零');closeSettings();});
document.getElementById('btnResetSettings').addEventListener('click',()=>{
  ['pomo_work_min','pomo_short_min','pomo_long_min','pomo_sound','pomo_autostart','pomo_confirm','pomo_topmost','pomo_mini','pomo_dark','pomo_picked_color'].forEach(k=>localStorage.removeItem(k));
  CONFIG.work.minutes=25;CONFIG.short.minutes=5;CONFIG.long.minutes=15; soundEnabled=true;autoStart=true;confirmMode=true;alwaysOnTop=false;miniMode=false;darkMode=false;resetPickedColor();
  sendToHost({type:'alwaysOnTop',value:false});sendToHost({type:'setDarkMode',value:false});
  document.body.classList.remove('dark','mini');applyMini(false); saveSettings();refreshSettingsUI();
  if(!running)setMode(currentMode); showToast('已恢复默认设置');
});
document.querySelectorAll('.mode-btn').forEach(btn=>{btn.addEventListener('click',()=>{if(running)pauseTimer();setMode(btn.dataset.mode);});});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();running?pauseTimer():startTimer();}
  if(e.code==='KeyR')stopTimer(); if(e.code==='KeyS')skipCurrent();
  if(e.code==='Digit1'){if(running)pauseTimer();setMode('work');}
  if(e.code==='Digit2'){if(running)pauseTimer();setMode('short');}
  if(e.code==='Digit3'){if(running)pauseTimer();setMode('long');}
  if(e.code==='Escape'){ const a=document.getElementById('alarmOverlay'),s=document.getElementById('settingsOverlay'); if(a.classList.contains('show')){stopAlarm();a.classList.remove('show');} else if(s.classList.contains('open'))closeSettings(); }
  if(e.code==='Enter'){ const a=document.getElementById('alarmOverlay'); if(a.classList.contains('show'))confirmNext(); }
});
document.addEventListener('click',()=>{if(Notification.permission==='default')Notification.requestPermission();},{once:true});

// ===== 按钮内光晕追踪 =====
const glows={ skip:document.getElementById('glowSkip'), play:document.getElementById('glowPlay'), reset:document.getElementById('glowReset'), modes:document.getElementById('glowModes') };
let gx=-500,gy=-500,cx=-500,cy=-500,activeGlow=null;
function findWrapper(el){ while(el){ if(el.classList&&el.classList.contains('liquid_glass-wrapper'))return el; el=el.parentElement; } return null; }
function getGlowFor(wrapper){ if(!wrapper)return null; const id=wrapper.id; if(id==='btnSkipWrap')return glows.skip; if(id==='btnPlayWrap')return glows.play; if(id==='btnResetWrap')return glows.reset; if(id==='modesWrap')return glows.modes; return null; }
document.addEventListener('mousemove',e=>{
  const w=findWrapper(e.target);
  if(w){ const r=w.getBoundingClientRect(); gx=e.clientX-r.left; gy=e.clientY-r.top; activeGlow=getGlowFor(w); }
  else if(activeGlow){ activeGlow.classList.remove('on');activeGlow=null; }
});
// 触摸事件 — Android 长按放大+光影跟随手指
let touchWrapper=null;
document.addEventListener('touchstart',e=>{
  const w=findWrapper(e.target);
  if(w){
    touchWrapper=w; w.classList.add('pressed');
    const t=e.touches[0]; const r=w.getBoundingClientRect();
    gx=t.clientX-r.left; gy=t.clientY-r.top;
    activeGlow=getGlowFor(w);
  }
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(touchWrapper){
    const t=e.touches[0]; const r=touchWrapper.getBoundingClientRect();
    gx=t.clientX-r.left; gy=t.clientY-r.top;
  }
},{passive:false});
document.addEventListener('touchend',()=>{
  if(touchWrapper){ touchWrapper.classList.remove('pressed'); touchWrapper=null; if(activeGlow){activeGlow.classList.remove('on');activeGlow=null;} }
});
document.addEventListener('touchcancel',()=>{
  if(touchWrapper){ touchWrapper.classList.remove('pressed'); touchWrapper=null; if(activeGlow){activeGlow.classList.remove('on');activeGlow=null;} }
});
function animateGlow(){
  cx+=(gx-cx)*0.18;cy+=(gy-cy)*0.18;
  if(activeGlow){ activeGlow.classList.add('on'); activeGlow.style.left=cx+'px'; activeGlow.style.top=cy+'px'; }
  requestAnimationFrame(animateGlow);
}
requestAnimationFrame(animateGlow);

checkToday();updateDisplay();updateStats();setMode('work');
</script>
</body>
</html>
